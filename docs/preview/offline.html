<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>呱咩小窩帳｜沒有網路</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8ec; color: #4a3b2c;

    .card { background: #fffdf8; border: 4px solid #c89f72; border-radius: 22px; padding: 24px; max-width: 360px; }
    img { width: 96px; border-radius: 24px; }
    button { font: inherit; font-weight: 700; margin-top: 12px; padding: 10px 20px; border-radius: 999px;
      border: 3px solid #5b8f29; background: #8bc34a; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/記帳APP 圖示.png" alt="" />
    <h1>小窩連不上網路 😿</h1>
    <p>呱呱和咩咩需要網路才能讀取帳本，請確認網路後再試一次。</p>
    <button onclick="location.reload()">再試一次</button>
  </div>
</body>
</html>

# 呱咩小窩帳｜後端設定（Cloudflare Workers）
# 注意：這個檔案會上傳到 GitHub，所以「絕對不要」把任何密碼寫在這裡。
# 密碼一律用：npx wrangler secret put 名稱

name = "guamie-ledger-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Gemini 轉送站（放在美國）：台灣使用者常被分到香港機房，但 Google 不開放香港使用 Gemini API。
# 主要後端留在亞洲（靠近資料庫），只有呼叫 Gemini 時交給轉送站（見 ../worker-gemini）。
[[services]]
binding = "GEMINI_PROXY"
service = "guamie-ledger-gemini"

# 公開設定（不是密碼，可以放這裡）
[vars]
# 允許呼叫後端的網站（GitHub Pages 網域）；第 2 階段上線後改成實際網址。
# 多個網址用逗號分隔；本機測試網址只在本機開發時有效（見 src/cors.js）。
ALLOWED_ORIGINS = "https://gghihi.github.io"
# 登入完成後回到的前端網址
FRONTEND_URL = "https://gghihi.github.io/guamie-ledger/"
# Google 用戶端 ID（公開資訊，不是密碼；「用戶端密碼」另存在 Cloudflare 保險箱）
GOOGLE_CLIENT_ID = "524821288754-eohili8cnos8vb5ukq6msg8k7rbi942j.apps.googleusercontent.com"
# Gemini 模型名稱（已確認：gemini-3.8-flash）。要換模型只改這裡。
GEMINI_MODEL = "gemini-3.8-flash"
# 主要模型忙碌或出錯時改用的備用模型（使用者 2026-11-19 同意加入）。不需要時留空字串即可。
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
# 計算「今天」「昨天」時使用的時區
APP_TIMEZONE = "Asia/Taipei"

# 資料庫（D1）：程式裡用 env.DB 存取
# database_id 只是資料庫的編號，不是密碼；沒有 Cloudflare 帳號權限的人無法使用。
[[d1_databases]]
binding = "DB"
database_name = "guamie-ledger-db"
database_id = "53c0b987-13c7-4d7a-b4bb-47e710d2c835"
migrations_dir = "migrations"
